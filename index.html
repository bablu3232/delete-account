<!DOCTYPE html>
<html>
<head>
    <title>Delete Account - DrugsSearch</title>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: Arial;
            padding: 20px;
            line-height: 1.6;
            background: #f9f9f9;
        }

        h1 {
            color: #333;
        }

        form {
            margin-top: 20px;
        }

        input, textarea {
            width: 300px;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px 18px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
            
        }

        /* Popup */
        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
        }

        .popup-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: fadeIn 0.3s ease-in-out;
        }

        .popup-content h2 {
            color: #2ecc71;
        }

        .close-btn {
            margin-top: 15px;
            background: #2ecc71;
        }

        .close-btn:hover {
            background: #27ae60;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translate(-50%, -60%);}
            to {opacity: 1; transform: translate(-50%, -50%);}
        }
    </style>
</head>

<body>

<h1>Delete Account - DrugsSearch</h1>

<p>Last updated: March 2026</p>

<p>If you want to delete your DrugsSearch account, please fill out the form below.</p>

<h2>Account Deletion Request Form</h2>

<form onsubmit="handleSubmit(event)">

    <label>Full Name:</label><br>
    <input type="text" required><br>

    <label>Registered Email:</label><br>
    <input type="email" required><br>

    <label>Registered Mobile Number:</label><br>
    <input type="tel" pattern="[0-9]{10}" placeholder="Enter 10-digit number" required><br>

    <label>Reason for Deletion:</label><br>
    <textarea rows="4"></textarea><br>

    <button type="submit">Submit Request</button>

</form>

<!-- Popup -->
<div id="popup" class="popup">
    <div class="popup-content">
        <h2>✅ Successfully Submitted</h2>
        <p>Your request has been received.</p>
        <button class="close-btn" onclick="closePopup()">OK</button>
    </div>
</div>

<script>
function handleSubmit(event) {
    event.preventDefault(); // prevent page reload (NO 404)
    document.getElementById("popup").style.display = "block";
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
